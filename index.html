<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <nav class="nav">
        <a href="index.html">Profile</a>
        <a href="contact.html">Contact Us</a>
        <a href="about.html" aria-current="page">About Me</a>
    </nav>
</header>
  <main class="profile-card" data-test-id="profile-card">
    
    <header class="profile-header">
      <div class="status-indicator" 
           data-test-id="status-indicator" 
           aria-label="User is online"></div>

      <figure class="profile-image" data-test-id="profile-image">
        <img 
          src="https://github.com/Oluwatomilola.png" 
          alt="Profile picture of Oluwatomilola Ayeni" 
          data-test-id="profile-image-img">
        <figcaption class="visually-hidden">
          Profile picture of Oluwatomilola Ayeni
        </figcaption>
      </figure>

      <h1 class="profile-name" data-test-id="profile-name">Oluwatomilola Ayeni</h1>
      <p class="profile-title" data-test-id="profile-title">Frontend Developer</p>
    </header>

    <section class="profile-description" data-test-id="profile-description">
      <p>
        Passionate about creating beautiful, accessible, and performant web experiences. 
        Love working with modern technologies and clean code.
      </p>
    </section>

    <section class="profile-actions" data-test-id="profile-actions" aria-label="Profile actions">
        <div class="profile-actions" data-test-id="profile-actions">
            <a href="https://www.linkedin.com/in/oluwatomilola-ayeni-553368127/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="btn btn-primary" 
               data-test-id="btn-follow" 
               aria-label="Follow on LinkedIn">
               Follow
            </a>
          
            <a href="mailto:tommy4gold@gmail.com" 
               class="btn btn-secondary" 
               data-test-id="btn-message" 
               aria-label="Send Email">
               Message
            </a>
          </div>
              </section>

    <footer class="social-links" data-test-id="social-links" aria-label="Social media links">
      <a href="https://github.com/Oluwatomilola" 
         class="social-link" 
         data-test-id="social-github" 
         aria-label="GitHub profile of Oluwatomilola Ayeni"
         target="_blank" rel="noopener noreferrer">
        <span>GitHub</span>
      </a>
      <a href="https://twitter.com/hadassahayeni" 
         class="social-link" 
         data-test-id="social-twitter" 
         aria-label="Twitter profile of Oluwatomilola Ayeni"
         target="_blank" rel="noopener noreferrer">
        <span>X</span>
      </a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
