<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
    <nav class="nav">
        <a href="index.html">Profile</a>
        <a href="contact.html" aria-current="page">Contact Us</a>
        <a href="about.html">About Me</a>
    </nav>
</header>

<main data-testid="test-contact-page" style="padding: 2rem";>
    <h1>Contact Us</h1>

    <form id="contactForm" novalidate>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text"
                   data-testid="test-contact-name" required />
            <span id="error-name" data-testid="test-contact-error-name"
                  class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email"
                   data-testid="test-contact-email" required
                   aria-describedby="error-email" />
            <span id="error-email" data-testid="test-contact-error-email"
                  class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text"
                   data-testid="test-contact-subject" required />
            <span id="error-subject" data-testid="test-contact-error-subject"
                  class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message"
                      data-testid="test-contact-message"
                      minlength="10" required></textarea>
            <span id="error-message" data-testid="test-contact-error-message"
                  class="error" aria-live="polite"></span>
        </div>

        <button type="submit" class="btn btn-primary"
                data-testid="test-contact-submit">Send</button>

        <p class="success" data-testid="test-contact-success" hidden>
            ✅ Your message has been sent successfully!
        </p>
    </form>
</main>

<script src="script.js"></script>
</body>
</html>
